<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realm of Numeraria: Fraction Quest 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Kanit', sans-serif; background-color: #0f172a; color: white; user-select: none; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border { box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        /* Touch Joystick UI */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(0, 255, 245, 0.4); border-radius: 50%; touch-action: none; display: flex; align-items: center; justify-content: center; z-index: 40; }
        #joystick-knob { width: 50px; height: 50px; background: rgba(0, 255, 245, 0.8); border-radius: 50%; box-shadow: 0 0 10px #00fff5; pointer-events: none; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div class="absolute top-4 left-4 flex flex-col gap-3 pointer-events-none z-10">
        <!-- Player Stats -->
        <div class="glass p-3 md:p-4 rounded-2xl flex items-center gap-3 pointer-events-auto min-w-[200px]">
            <div class="relative w-10 h-10 md:w-12 md:h-12 rounded-full bg-gradient-to-tr from-cyan-500 to-fuchsia-500 flex items-center justify-center font-bold text-lg md:text-xl border-2 border-white shadow-lg">
                <span id="level-display">1</span>
            </div>
            <div class="flex-1">
                <div class="flex justify-between text-[10px] md:text-xs font-semibold mb-1">
                    <span class="text-cyan-400">HP</span>
                    <span id="hp-text">100/100</span>
                </div>
                <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden mb-1">
                    <div id="hp-bar" class="bg-gradient-to-r from-emerald-400 to-cyan-400 h-full transition-all duration-300" style="width: 100%"></div>
                </div>
                <div class="flex justify-between text-[10px] md:text-xs font-semibold mb-1">
                    <span class="text-fuchsia-400">EXP</span>
                    <span id="exp-text">0/100</span>
                </div>
                <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                    <div id="exp-bar" class="bg-gradient-to-r from-fuchsia-500 to-pink-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Inventory / Gems -->
        <div class="glass px-3 py-1.5 rounded-xl flex items-center gap-2 pointer-events-auto w-fit text-xs md:text-sm">
            <span>💎</span>
            <span class="font-semibold">Gems: <span id="gem-count" class="text-yellow-400 font-bold">0</span></span>
        </div>
    </div>

    <!-- Mini Map -->
    <div class="absolute top-4 right-4 pointer-events-none z-10">
        <div class="glass p-2 rounded-2xl border-2 border-cyan-500/30 neon-border pointer-events-auto relative w-28 h-28 md:w-36 md:h-36 flex items-center justify-center overflow-hidden">
            <div class="text-[9px] absolute top-1 left-2 font-bold text-cyan-400 opacity-80">MINI MAP</div>
            <canvas id="minimap" width="100" height="100" class="rounded-xl bg-slate-900/80"></canvas>
        </div>
    </div>

    <!-- Quest Tracker -->
    <div class="absolute top-36 right-4 md:top-auto md:bottom-6 md:left-4 pointer-events-none z-10 max-w-[180px] md:max-w-xs">
        <div class="glass p-3 rounded-xl pointer-events-auto border-l-4 border-cyan-400">
            <h3 class="text-[10px] md:text-xs font-bold text-cyan-400 uppercase tracking-wider mb-1">🎯 ภารกิจปัจจุบัน</h3>
            <p id="quest-text" class="text-[11px] md:text-sm font-light text-slate-200 leading-tight">เดินตามจุดคริสตัลสีเหลือง เพื่อตอบคำถามเศษส่วน</p>
        </div>
    </div>

    <!-- Virtual Joystick for Mobile -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center hidden z-50 p-4">
        <div class="glass p-5 md:p-8 rounded-3xl max-w-lg w-full border border-cyan-500/30 neon-border transform transition-all scale-95 opacity-0 duration-300" id="quiz-box">
            <div class="flex justify-between items-center mb-3">
                <span class="text-[10px] md:text-xs font-bold uppercase tracking-wider text-fuchsia-400 bg-fuchsia-950/50 px-3 py-1 rounded-full border border-fuchsia-800">โจทย์เศษส่วน ม.ปลาย</span>
            </div>
            
            <h2 id="quiz-question" class="text-base md:text-xl font-medium mb-5 text-white leading-relaxed">คำถามจะปรากฏที่นี่...</h2>

            <div id="quiz-options" class="grid grid-cols-1 gap-2.5 mb-5">
                <!-- Options injected by JS -->
            </div>

            <div id="quiz-feedback" class="text-center font-semibold text-sm min-h-[24px]"></div>
        </div>
    </div>

    <!-- Respawn Overlay -->
    <div id="respawn-screen" class="fixed inset-0 bg-red-950/90 backdrop-blur-lg flex flex-col items-center justify-center hidden z-50">
        <h1 class="text-3xl md:text-4xl font-extrabold text-red-500 mb-2 tracking-wider animate-pulse">พลังชีวิตหมดลง!</h1>
        <p class="text-xs md:text-sm text-slate-300 mb-6">กำลังวาร์ปกลับไปยังจุดเกิดใหม่...</p>
        <div class="w-10 h-10 border-4 border-red-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <script>
        // --- GAME STATE ---
        const player = {
            x: 0, z: 0,
            hp: 100, maxHp: 100,
            exp: 0, maxExp: 100,
            level: 1, gems: 0,
            speed: 0.15
        };

        let moveVector = { x: 0, z: 0 };
        const keys = {};
        let activeQuizIndex = null;

        // Math Questions
        const questions = [
            {
                q: "จงหาผลบวกของเศษส่วนพหุนาม: (1/x) + (2/(x+1))",
                options: ["(3x + 1) / x(x + 1)", "3 / (2x + 1)", "(x + 3) / x(x + 1)", "(3x + 2) / x²"],
                correct: 0
            },
            {
                q: "ทำให้อยู่ในรูปอย่างง่าย: (x² - 4) / (x - 2)",
                options: ["x - 2", "x + 2", "x² + 2", "2x"],
                correct: 1
            },
            {
                q: "หาค่าของ x จากสมการ: (3/x) = (6/(x+2))",
                options: ["x = 1", "x = 3", "x = 2", "x = 4"],
                correct: 2
            },
            {
                q: "ผลคูณของ ((x-1)/(x+3)) * ((x+3)/(x²-1)) เท่ากับข้อใด",
                options: ["1 / (x + 1)", "1 / (x - 1)", "x + 1", "1"],
                correct: 0
            }
        ];

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Floor
        const gridHelper = new THREE.GridHelper(100, 50, 0x00fff5, 0x1e293b);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        const planeGeo = new THREE.PlaneGeometry(100, 100);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
        const floor = new THREE.Mesh(planeGeo, planeMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Player Model
        const playerGroup = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.2, 1.2, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00fff5, emissive: 0x005577, roughness: 0.2 });
        const playerMesh = new THREE.Mesh(bodyGeo, bodyMat);
        playerMesh.position.y = 0.6;
        playerMesh.castShadow = true;
        playerGroup.add(playerMesh);

        // Ring
        const ringGeo = new THREE.RingGeometry(0.5, 0.7, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00fff5, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.02;
        playerGroup.add(ring);

        scene.add(playerGroup);

        // Crystals
        const crystals = [];
        const crystalPositions = [
            { x: 10, z: -10 },
            { x: -12, z: -15 },
            { x: 15, z: 12 },
            { x: -10, z: 10 }
        ];

        const crystalGeo = new THREE.OctahedronGeometry(0.8, 0);
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0xeab308, emissive: 0xca8a04, roughness: 0.1 });

        crystalPositions.forEach((pos, idx) => {
            const crystal = new THREE.Mesh(crystalGeo, crystalMat);
            crystal.position.set(pos.x, 1, pos.z);
            crystal.castShadow = true;
            crystal.userData = { id: idx, active: true };
            scene.add(crystal);
            crystals.push(crystal);
        });

        // Shrine
        const shrineGeo = new THREE.BoxGeometry(2, 0.2, 2);
        const shrineMat = new THREE.MeshStandardMaterial({ color: 0xec4899, emissive: 0x831843 });
        const shrine = new THREE.Mesh(shrineGeo, shrineMat);
        shrine.position.set(0, 0.1, 0);
        scene.add(shrine);

        // --- JOYSTICK CONTROLS (TOUCH) ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false;
        let joyStartX = 0, joyStartY = 0;

        function handleJoystickStart(clientX, clientY) {
            joystickActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joyStartX = rect.left + rect.width / 2;
            joyStartY = rect.top + rect.height / 2;
            handleJoystickMove(clientX, clientY);
        }

        function handleJoystickMove(clientX, clientY) {
            if (!joystickActive) return;
            const dx = clientX - joyStartX;
            const dy = clientY - joyStartY;
            const dist = Math.hypot(dx, dy);
            const maxDist = 40;

            const angle = Math.atan2(dy, dx);
            const moveDist = Math.min(dist, maxDist);

            const knobX = Math.cos(angle) * moveDist;
            const knobY = Math.sin(angle) * moveDist;

            joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

            moveVector.x = knobX / maxDist;
            moveVector.z = knobY / maxDist;
        }

        function handleJoystickEnd() {
            joystickActive = false;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveVector.x = 0;
            moveVector.z = 0;
        }

        joystickZone.addEventListener('touchstart', (e) => handleJoystickStart(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', (e) => { if (joystickActive) handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', handleJoystickEnd);

        // Keyboard Backup
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            let moveX = moveVector.x;
            let moveZ = moveVector.z;

            if (keys['w'] || keys['arrowup']) moveZ = -1;
            if (keys['s'] || keys['arrowdown']) moveZ = 1;
            if (keys['a'] || keys['arrowleft']) moveX = -1;
            if (keys['d'] || keys['arrowright']) moveX = 1;

            if (moveX !== 0 || moveZ !== 0) {
                const len = Math.hypot(moveX, moveZ);
                player.x += (moveX / (len > 1 ? len : 1)) * player.speed;
                player.z += (moveZ / (len > 1 ? len : 1)) * player.speed;
                playerGroup.position.set(player.x, 0, player.z);
            }

            camera.position.set(player.x, 10, player.z + 10);
            camera.lookAt(player.x, 0, player.z);

            // Rotate Crystals
            crystals.forEach(c => {
                if (c.userData.active) {
                    c.rotation.y += 0.02;
                    c.position.y = 1 + Math.sin(Date.now() * 0.003) * 0.2;

                    const dist = Math.hypot(player.x - c.position.x, player.z - c.position.z);
                    if (dist < 1.5) openQuiz(c.userData.id);
                }
            });

            drawMinimap();
            renderer.render(scene, camera);
        }

        // --- MINIMAP ---
        const minimapCanvas = document.getElementById('minimap');
        const mapCtx = minimapCanvas.getContext('2d');

        function drawMinimap() {
            mapCtx.clearRect(0, 0, 100, 100);
            const scale = 1.2;
            const cx = 50, cy = 50;

            mapCtx.fillStyle = '#00fff5';
            mapCtx.beginPath();
            mapCtx.arc(cx, cy, 3.5, 0, Math.PI * 2);
            mapCtx.fill();

            crystals.forEach(c => {
                if (c.userData.active) {
                    const mapX = cx + (c.position.x - player.x) * scale;
                    const mapY = cy + (c.position.z - player.z) * scale;
                    if (mapX >= 0 && mapX <= 100 && mapY >= 0 && mapY <= 100) {
                        mapCtx.fillStyle = '#eab308';
                        mapCtx.beginPath();
                        mapCtx.arc(mapX, mapY, 3, 0, Math.PI * 2);
                        mapCtx.fill();
                    }
                }
            });
        }

        // --- QUIZ SYSTEM ---
        function openQuiz(index) {
            activeQuizIndex = index;
            const qData = questions[index % questions.length];
            
            document.getElementById('quiz-question').innerText = qData.q;
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-4 py-3 rounded-xl bg-slate-800/90 hover:bg-cyan-600/30 border border-slate-700 hover:border-cyan-400 transition-all text-xs md:text-sm font-light";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, qData.correct);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-feedback').innerText = '';
            const modal = document.getElementById('quiz-modal');
            const box = document.getElementById('quiz-box');
            modal.classList.remove('hidden');
            setTimeout(() => box.classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeQuiz() {
            const modal = document.getElementById('quiz-modal');
            const box = document.getElementById('quiz-box');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function checkAnswer(selected, correct) {
            const feedback = document.getElementById('quiz-feedback');
            if (selected === correct) {
                feedback.className = "text-emerald-400 font-bold text-xs md:text-sm animate-bounce";
                feedback.innerText = "✨ ถูกต้อง! ได้รับ +50 EXP และ 10 Gems";

                addExp(50);
                player.gems += 10;
                document.getElementById('gem-count').innerText = player.gems;

                if (activeQuizIndex !== null) {
                    crystals[activeQuizIndex].userData.active = false;
                    crystals[activeQuizIndex].visible = false;
                }

                setTimeout(closeQuiz, 1200);
            } else {
                feedback.className = "text-red-400 font-bold text-xs md:text-sm";
                feedback.innerText = "❌ คำตอบไม่ถูกต้อง! เสียพลังชีวิต -25 HP";
                
                player.hp -= 25;
                updateHpBar();

                if (player.hp <= 0) {
                    closeQuiz();
                    triggerRespawn();
                }
            }
        }

        function addExp(amount) {
            player.exp += amount;
            if (player.exp >= player.maxExp) {
                player.level += 1;
                player.exp -= player.maxExp;
                player.maxExp = Math.floor(player.maxExp * 1.5);
                document.getElementById('level-display').innerText = player.level;
            }
            document.getElementById('exp-text').innerText = `${player.exp}/${player.maxExp}`;
            document.getElementById('exp-bar').style.width = `${(player.exp / player.maxExp) * 100}%`;
        }

        function updateHpBar() {
            document.getElementById('hp-text').innerText = `${player.hp}/${player.maxHp}`;
            document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
        }

        function triggerRespawn() {
            const screen = document.getElementById('respawn-screen');
            screen.classList.remove('hidden');

            setTimeout(() => {
                player.x = 0;
                player.z = 0;
                playerGroup.position.set(0, 0, 0);
                player.hp = player.maxHp;
                updateHpBar();
                screen.classList.add('hidden');
            }, 2000);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
